shellEmulator: true
strictPeerDependencies: false
publicHoistPattern:
  # ESLint-related
  # Dependencies of "eslint-config-coralloy" imported by the ESLint configs, kept transitive so they match the versions it uses
  - eslint-import-resolver-typescript
  - globals

  # "jsonwebtoken" is a "@nestjs/jwt" transitive dependency, which we have to reference directly because "@nestjs/jwt" doesn't re-export relevant parts
  # We are not installing it ourselves to avoid potential incompatibilities
  - jsonwebtoken
  - "@types/jsonwebtoken"

  # Imported by the server Jest specs; transitive dependency of "jest"
  # Remove when the server tests move off Jest
  - "@jest/globals"

  # Transitive dependency of "@quasar/app-vite", not installed separately so it always matches the version Quasar runs
  # The client references its "vite/client" types and the Cypress preprocessor imports it
  - vite

# Versions shared by more than one package
catalog:
  dotenv: ^16.4.5
  dotenv-expand: ^10.0.0
  fast-glob: ^3.3.3
  graphql: ^16.14.2
  graphql-ws: ^6.4.2
  lodash: ^4.17.21
  "@types/lodash": ^4.17.7

allowBuilds:
  "@apollo/protobufjs": true
  "@nestjs/core": false # Just prints Open Collective information
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  cypress: true
  esbuild: true
  msgpackr-extract: true # coming from bullmq
  prisma: true
  protobufjs: true # coming from firebase
  unrs-resolver: true
  vue-demi: true

overrides:
  vite: ^5.0.10
  "@vitejs/plugin-vue": ^4.5.2

patchedDependencies:
  prisma-nestjs-graphql@19.2.0: patches/prisma-nestjs-graphql@19.2.0.patch
  "@nestjs-modules/mailer@1.9.1": patches/@nestjs-modules__mailer@1.9.1.patch

packages:
  - "packages/**"
