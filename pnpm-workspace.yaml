shellEmulator: true
strictPeerDependencies: false
publicHoistPattern:
  # ESLint-related
  # Dependencies of "eslint-config-coralloy" imported by the ESLint configs, kept transitive so they match the versions it uses
  - eslint-import-resolver-typescript
  - globals

  # Imported by the server Jest specs; transitive dependency of "jest"
  # Remove when the server tests move off Jest
  - "@jest/globals"

  # Transitive dependency of "@quasar/app-vite", not installed separately so it always matches the version Quasar runs
  # The client references its "vite/client" types
  - vite

# Versions shared by more than one package
catalog:
  fast-glob: ^3.3.3
  graphql: ^16.14.2
  graphql-ws: ^6.4.2

allowBuilds:
  "@apollo/protobufjs": true
  "@firebase/util": true # coming from firebase-admin, only writes defaults when FIREBASE_WEBAPP_CONFIG is set
  "@nestjs/core": false # Just prints Open Collective information
  "@swc/core": true # Checks its native binary, used by @swc-node/register to run the server TypeScript scripts
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: true # coming from bullmq
  prisma: true
  protobufjs: true # coming from firebase
  unrs-resolver: true
  vue-demi: true

overrides:
  "nest-commander>@golevelup/nestjs-discovery": 7.1.0

patchedDependencies:
  prisma-nestjs-graphql@23.2.1: patches/prisma-nestjs-graphql.patch

packages:
  - "packages/**"
