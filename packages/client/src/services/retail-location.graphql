fragment Theme on Theme {
  logo
  colors {
    primary
    secondary
    accent
  }
}

fragment RetailLocationSettings on RetailLocation {
  buyRate
  sellRate
  registrationEnabled
  payOffEnabled
  maxBookingDays
  warehouseMaxBlockSize
}

fragment RetailLocation on RetailLocation {
  id
  name
  email
  fullAddress
  phoneNumber
  instagramLink
  facebookLink
  infoPagesContent

  ...RetailLocationSettings

  theme {
    ...Theme
  }
}

query getRetailLocations {
  retailLocations {
    ...RetailLocation
  }
}

mutation updateRetailLocationTheme($input: UpdateRetailLocationThemeInput!) {
  updateRetailLocationTheme(input: $input) {
    ...RetailLocation
  }
}

mutation updateRetailLocationSettings(
  $input: UpdateRetailLocationSettingsInput!
) {
  updateRetailLocationSettings(input: $input) {
    id # include the id so that the cache gets updated automatically
    ...RetailLocationSettings
  }
}

fragment Statistics on StatisticsQueryResult {
  bookCopiesCount
  booksInWarehouseCount
  booksWithProblemsCount
  booksWithProblemsInWarehouseCount
  salableBooksCount
  returnedBooksCount
  donatedBooksCount
  returnedBooksCount
  reimbursedBooksCount
  salesCount
  activeSalesCount
  refundedSalesCount
  activeReservationsCount
  activeRequestsCount
  activeUsersCount
  settleableAmount
  settledAmount
  toSettleAmount
  reimbursedAmount
  adminAccountsRevenue
  grossRevenue
  netRevenue
  buyingCustomersCount
  sellingCustomersCount
  customersCount
  usersWithDiscountCount
  requestingUsersCount
  purchasedOrSoldBooksAverage
  soldBooksFromSellersAverage
  purchasedBooksFromBuyersAverage
  settleableMoneyAverage
  activeUsersPerLocaleCount {
    count
    locale
  }
  soldBooksOriginalPriceTotal
  sellingCustomersIncomeAverage
  buyingCustomersFullExpenseAverage
  buyingCustomersDiscountedExpenseAverage
  buyingCustomersSavingAverage
}

query retailLocationStatistics($retailLocationId: String!) {
  retailLocationStatistics(retailLocationId: $retailLocationId) {
    ...Statistics
  }
}

mutation resetRetailLocation($input: ResetRetailLocationInput!) {
  resetRetailLocation(input: $input)
}

fragment chartData on ChartElement {
  amount
  timestamp
}

query getDeliveriesChartData($retailLocationId: String!) {
  deliveriesChartData(retailLocationId: $retailLocationId) {
    ...chartData
  }
}

query getSalesChartData($retailLocationId: String!) {
  salesChartData(retailLocationId: $retailLocationId) {
    ...chartData
  }
}

query getSettlementsChartData($retailLocationId: String!) {
  settlementsChartData(retailLocationId: $retailLocationId) {
    ...chartData
  }
}

query getReturningsChartData($retailLocationId: String!) {
  returningsChartData(retailLocationId: $retailLocationId) {
    ...chartData
  }
}

mutation updateRetailLocationInfo($input: UpdateRetailLocationInfoInput!) {
  updateRetailLocationInfo(input: $input) {
    ...RetailLocation
  }
}
