name: il-mercatino-del-libro
services:
  postgres:
    image: postgres:16-alpine
    container_name: ilmercatinodellibro-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgres/data
      - ${STORAGE_PATH}/tmp:/tmp/tmp-files
    # https://github.com/docker-library/docs/blob/master/postgres/README.md#environment-variables
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

  backup:
    image: alpine:latest
    container_name: backup
    depends_on:
      - postgres
    volumes:
      - ./backup/logs:/logs
      - ./backup/scripts:/scripts
      - ./backup/config/msmtprc:/etc/msmtprc_tmp
      - ./backup/config/crontabs:/etc/crontabs/root
      - ./backup/config/rclone.conf:/root/.config/rclone/rclone.conf_tmp
    env_file:
      - .env
    command: >
      sh -c '
      apk add --no-cache rclone postgresql-client tzdata msmtp gettext &&
      chmod +x /scripts/*.sh &&
      crond -f
      '

volumes:
  postgres:

networks:
  default:
    name: mercatino_network
